name: Deploy Documentation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# One run per ref: a new push to a PR supersedes (cancels) that PR's older
# build, but builds of *different* PRs no longer share a group and cannot
# cancel each other (the old global "pages" group did exactly that).
# Pushes to master are not cancelled mid-run, so a deploy is never cut off.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Required permissions for pushing to gh-pages branch
permissions:
  contents: write

# Bump together with `PYTHON` in tests.yml (the cache keys below use it).
env:
  PYTHON: "3.14"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON }}

    - name: Cache UV and dependencies
      id: cache-uv
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/uv
          .venv
        key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-python-${{ env.PYTHON }}-

    - name: Install UV
      run: |
        if [ ! -f "$HOME/.cargo/bin/uv" ]; then
          curl -LsSf https://astral.sh/uv/install.sh | sh
        fi
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install dependencies
      if: steps.cache-uv.outputs.cache-hit != 'true'
      run: |
        uv sync --extra dev

    - name: Install Sphinx
      run: |
        uv add --dev sphinx

    - name: Build documentation
      run: |
        uv run sphinx-build -b html doc/source doc/build/html
        echo "✅ Documentation built successfully"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: github-pages
        path: doc/build/html

  deploy:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    # Every deploy pushes to gh-pages: serialise them across all runs, and
    # never cancel one that is already pushing.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download built docs
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: built-docs

      - name: Deploy to gh-pages
        run: |
          cd gh-pages
          rm -rf *
          mv ../built-docs/* .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy documentation for ${GITHUB_SHA}" || echo "No changes to commit"
          git push