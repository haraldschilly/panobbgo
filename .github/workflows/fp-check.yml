name: FP check

# Checks the FP pin (panobbgo/fp_env.py, doc/dev/benchmarking.md):
# the SAME seeded family screen (preset free, seed 42, dims 2/5) on 8
# runners, which land on AVX2 and AVX-512 hosts at random, plus large
# BLAS / LAPACK digests (scripts/fp_blas_digest.py).  The last job asserts
# that all 8 produced bit-identical rows and digests and reports each job's
# CPU and FP environment.  Manual only.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check (default: the ref this workflow runs from)"
        type: string
        default: ""
      pin:
        description: "PANOBBGO_FP_PIN for the screens: '1' (pinned) or '0' (unpinned, to see the spread)"
        type: choice
        options: ["1", "0"]
        default: "1"

permissions:
  contents: read

env:
  PYTHON: "3.14"

jobs:
  screen:
    name: screen ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      PANOBBGO_FP_PIN: ${{ inputs.pin }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Cache UV and dependencies
        id: cache-uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uv
            .venv
          key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Install UV
        run: |
          if [ ! -f "$HOME/.cargo/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: lscpu
        run: lscpu

      - name: Screen (families free, seed 42, dims 2/5)
        env:
          JOB: ${{ matrix.job }}
        run: |
          mkdir -p "fp-check/job$JOB"
          uv run python -m panobbgo.fp_pin > "fp-check/job$JOB/fp_env.json"
          cat "fp-check/job$JOB/fp_env.json"
          # Large GEMM / lstsq / eigh (the screen's are small): must match on every runner.
          uv run python scripts/fp_blas_digest.py > "fp-check/job$JOB/blas_digest.txt"
          cat "fp-check/job$JOB/blas_digest.txt"
          uv run python benchmarks/family_screen.py "fp-check/job$JOB/rows.json" 42 preset=free dims=2,5 \
            jobs="$(nproc)"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fp-check-job${{ matrix.job }}
          path: fp-check/
          if-no-files-found: warn
          retention-days: 30

  compare:
    needs: screen
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Download
        uses: actions/download-artifact@v8
        with:
          pattern: fp-check-job*
          path: fp-check-raw

      - name: Bit-identical?
        # Stdlib only.
        run: |
          rc=0
          python3 scripts/fp_check.py fp-check-raw > fp-check.log 2>&1 || rc=$?
          n_jobs=$(ls -d fp-check-raw/*/ | wc -l)
          n_digest=$(ls fp-check-raw/*/*/blas_digest.txt 2>/dev/null | wc -l)
          n_distinct=$(cat fp-check-raw/*/*/blas_digest.txt 2>/dev/null | sort -u | wc -l)
          n_files=$(md5sum fp-check-raw/*/*/blas_digest.txt 2>/dev/null | cut -d' ' -f1 | sort -u | wc -l)
          echo "BLAS digests: $n_digest of $n_jobs jobs, $n_files distinct file(s), $n_distinct distinct line(s)" >> fp-check.log
          if [ "$n_digest" -ne "$n_jobs" ] || [ "$n_files" -ne 1 ]; then
            echo "BLAS digests differ between runners, or a job did not write them (crash?)" >> fp-check.log; rc=1
          fi
          cat fp-check.log
          { echo '### FP check'; echo '```'; cat fp-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
