name: Measure (expensive track)

# The expensive-track measurement (roadmap §5.2): panobbgo against the
# incumbents at small budgets (bm*d evaluations) with q parallel workers on
# the virtual clock, AOCC over evaluations and aocc_time over virtual time.
# Manual only; ./test.sh (run_ci.py) skips it.  The engine is
# scripts/measure.py: `plan` packs (group x cell x seed) units into shards by
# estimated cost, each shard runs its units, the last job aggregates.
# Results are artifacts only (no release).  doc/dev/benchmarking.md,
# "Expensive-track measurement".

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "A count (the first N of the decision roster) or a comma list of base seeds (one seed: '42,')"
        type: string
        default: "5"
      presets:
        description: "Family presets, comma list of: free, failure, wide (wide: 15 families, opt-in, 3x the cost of free)"
        type: string
        default: free
      budgets:
        description: "Budget multipliers (budget = bm * dim)"
        type: string
        default: "20,100"
      dims:
        description: "Restrict the presets' dimensions, e.g. '2' (empty: all)"
        type: string
        default: ""
      battery_seed:
        description: >-
          Battery seed of every preset's instances (empty: the default 20260910, the fixed development battery of record);
          another seed draws a fresh battery (new optima, rotations, failure regions) and tags the unit ids
          <group>.<preset>-<seed>...
        type: string
        default: ""
      qs:
        description: "Virtual worker counts (only q <= bm runs, so 64 at 100*d only)"
        type: string
        default: "1,4,16,64"
      groups:
        description: >-
          'all' (= core, qLogEI, TuRBO1, SMAC) or a comma list of: core, qLogEI, TuRBO1, SMAC, trq.
          trq (opt-in, never in 'all'): the opt-in candidates (RoundRobin_TRQ, Blocks_warm_CMAES_JSO_TRQ,
          RoundRobin_COBYQA, RoundRobin_TRQ_r05, RoundRobin_TRQ_fa, RoundRobin_TRQ_aware,
          Blocks_warm_CMAES_JSO_dimbudget) on the core cells, secondary specs in the summary with a paired delta
          against the headline spec and against their base spec (same seed_name); e.g. 'core,qLogEI,TuRBO1,SMAC,trq'
        type: string
        default: all
      extra_units:
        description: >-
          Extra units (calibration runs; split and packed like the grid, in extra-NN shards of their own), ';'-joined ids
          <group>.<preset>[-<battery>].b<bm>.q<q>.d<dim>.s<seed>[.i<j>][.f<k>] (their own battery; battery_seed
          does not apply to them), e.g.
          'SMAC.free.b20.q1.d10.s42.i0;qLogEI.free.b100.q64.d5.s42.f0'
        type: string
        default: ""
      ref:
        description: "Git ref to measure (default: the ref this workflow runs from)"
        type: string
        default: ""

permissions:
  contents: read

env:
  PYTHON: "3.14"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Plan the shards
        id: plan
        # Stdlib only: no dependencies needed to plan.  The planner refuses
        # (exit 2, which fails this step) a plan with a shard estimated above
        # its target (90 min): no shard is meant to run into the step limit.
        env:
          SEEDS: ${{ inputs.seeds }}
          PRESETS: ${{ inputs.presets }}
          BUDGETS: ${{ inputs.budgets }}
          DIMS: ${{ inputs.dims }}
          BATTERY: ${{ inputs.battery_seed }}
          QS: ${{ inputs.qs }}
          GROUPS: ${{ inputs.groups }}
          EXTRA: ${{ inputs.extra_units }}
        run: |
          matrix=$(python3 scripts/measure.py plan --seeds "$SEEDS" --presets "$PRESETS" \
            --budgets "$BUDGETS" --dims "$DIMS" --battery-seed "$BATTERY" --qs "$QS" --groups "$GROUPS" \
            --extra-units "$EXTRA")
          sha=$(git rev-parse HEAD)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Measurement plan"
            echo "commit \`$sha\`, seeds \`$SEEDS\`, presets \`$PRESETS\`, budgets \`$BUDGETS\`, dims \`${DIMS:-all}\`, battery seed \`${BATTERY:-20260910 (default)}\`, qs \`$QS\`, groups \`$GROUPS\`"
            echo
            echo "| shard | units | est. min |"
            echo "|---|---|---|"
            echo "$matrix" | python3 -c 'import json, sys; [print("|", e["shard"], "|", e["n_units"], "|", e["est_min"], "|") for e in json.load(sys.stdin)["include"]]'
            echo
            echo "$matrix" | python3 -c 'import json, sys; e = [x["est_min"] for x in json.load(sys.stdin)["include"]]; print(f"{len(e)} shards, the longest ~{max(e)} min, ~{sum(e) / 60:.1f} runner-hours (conservative estimates)")'
          } >> "$GITHUB_STEP_SUMMARY"

  measure:
    needs: plan
    name: ${{ matrix.shard }} (${{ matrix.n_units }} units, ~${{ matrix.est_min }} min)
    runs-on: ubuntu-latest
    # Shards are planned at <= 90 estimated minutes (a conservative p90 cost
    # model, scripts/measure.py RUNNER_SECONDS); the limits leave room for a
    # slow runner and the set-up.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # A public repository gets 20 concurrent jobs in all: leave 4 for PR CI.
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # The FP pin (panobbgo/fp_env.py), as in rebaseline.yml: the entry point
    # sets it itself; the job-level copy also covers anything that loads numpy
    # first.  AVX2 and AVX-512 runners then run the same kernels.
    env:
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_L2_SIZE: "2048"  # OpenBLAS 0.3.34 Zen 4 override (panobbgo/fp_env.py)
      NPY_DISABLE_CPU_FEATURES: X86_V4 AVX512_ICL AVX512_SPR
      ATEN_CPU_CAPABILITY: avx2
      MKL_CBWR: AVX2
      MKL_ENABLE_INSTRUCTIONS: AVX2
      ONEDNN_MAX_CPU_ISA: AVX2

    steps:
      - uses: actions/checkout@v6
        with:
          # The commit the plan resolved: every shard measures the same code.
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      # As tests.yml test-bo: no .venv cache (a torch venv is ~360 MB per
      # entry and would evict the other jobs' caches); uv's own download cache,
      # pruned, under a suffix of its own.
      - name: Install UV (with its download cache)
        uses: astral-sh/setup-uv@v10.2.0  # no floating major tag after v7
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: measure
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      # Every group installs every extra: the core group needs `baselines`
      # (pycma / Nevergrad / Optuna) and Py-BOBYQA from `baselines-bo`.
      - name: Install dependencies
        run: |
          uv sync --extra dev --extra baselines --extra baselines-bo

      - name: Record the CPU
        run: |
          lscpu | tee lscpu.txt
          mkdir -p measure-out && mv lscpu.txt "measure-out/lscpu_${{ matrix.shard }}.txt"

      - name: Measure
        # Below the job's 150: the upload below still runs, with every unit
        # finished so far (each unit's file is written when it finishes).
        timeout-minutes: 140
        env:
          UNITS: ${{ matrix.units }}
          SHARD: ${{ matrix.shard }}
          # Extra units (-f extra_units) are calibration runs: reported apart, never analysed with the grid.
          CALIBRATION: ${{ matrix.calibration }}
        run: |
          cal=()
          if [ "$CALIBRATION" = true ]; then cal=(--calibration); fi
          uv run python scripts/measure.py run --units "$UNITS" --shard "$SHARD" \
            --out-dir measure-out --jobs "$(nproc)" --no-nice "${cal[@]}"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: measure-${{ matrix.shard }}
          path: measure-out/
          if-no-files-found: warn
          retention-days: 90
          # A re-run of the job replaces its artifact instead of failing on the name.
          overwrite: true

  aggregate:
    needs: [plan, measure]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install UV (with its download cache)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: measure-aggregate
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Download shard results
        uses: actions/download-artifact@v8
        with:
          pattern: measure-*
          path: measure-raw

      - name: Aggregate
        env:
          # The planned matrix: a unit that left no result file is reported missing.
          PLAN: ${{ needs.plan.outputs.matrix }}
        run: |
          printf '%s' "$PLAN" > plan.json
          uv run python scripts/measure.py aggregate measure-raw --plan plan.json \
            --out-dir measure-summary > /dev/null
          cp plan.json measure-summary/
          cat measure-summary/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: measure-summary
          path: measure-summary/
          retention-days: 90
          overwrite: true
