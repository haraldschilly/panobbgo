name: Re-baseline

# Re-measures the reference baselines (composite quick/standard, IOH
# quick/standard, IOH standard with the external pycma / Nevergrad / Optuna
# baselines, family free/constrained/shapes/failure) on GitHub runners,
# sharded over (suite x seed chunk).  Manual only; ./test.sh (run_ci.py) skips it.
# Every run is synchronous and seeded with no wall-clock limit, so the
# numbers depend on the code and the seeds, not on runner speed.
# The last job aggregates the shards and attaches the reference files to a
# GitHub pre-release (rebaseline-<date>); fetch them with
# `scripts/rebaseline.py fetch <tag>` (doc/dev/benchmarking.md,
# "Re-baselining on GitHub runners").

on:
  workflow_dispatch:
    inputs:
      suites:
        description: >-
          'all' or a comma list of: composite-quick, composite-standard,
          ioh-quick, ioh-standard, ioh-external, families-free,
          families-constrained, families-shapes, families-failure
        type: string
        default: all
      seeds:
        description: "A count (the first N of the 12-seed decision roster) or a comma list of base seeds (one seed: '42,')"
        type: string
        default: "12"
      ref:
        description: "Git ref to measure (default: the ref this workflow runs from)"
        type: string
        default: ""
      release:
        description: >-
          Release for the reference files: 'auto' (tag rebaseline-<UTC date>;
          refused when a shard failed), an explicit tag starting with
          'rebaseline-' (e.g. rebaseline-smoke-<date> for a test run), or 'none'
        type: string
        default: auto

permissions:
  contents: read

env:
  PYTHON: "3.14"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Plan the shards
        id: plan
        # Stdlib only: no dependencies needed to plan.
        env:
          SUITES: ${{ inputs.suites }}
          SEEDS: ${{ inputs.seeds }}
          RELEASE: ${{ inputs.release }}
        run: |
          # Validate the release input now, not after hours of measuring.
          if [ "$RELEASE" != auto ] && [ "$RELEASE" != none ]; then
            if ! [[ "$RELEASE" =~ ^rebaseline-[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
                || ! git check-ref-format "refs/tags/$RELEASE"; then
              echo "::error::release must be 'auto', 'none' or a valid tag 'rebaseline-...' ([A-Za-z0-9._-]); got '$RELEASE'"
              exit 1
            fi
          fi
          matrix=$(python3 scripts/rebaseline.py plan --suites "$SUITES" --seeds "$SEEDS")
          sha=$(git rev-parse HEAD)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Re-baseline plan"
            echo "commit \`$sha\`, suites \`$SUITES\`, seeds \`$SEEDS\`"
            echo '```json'
            echo "$matrix" | python3 -m json.tool
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  measure:
    needs: plan
    name: ${{ matrix.suite }} ${{ matrix.shard }} (seeds ${{ matrix.seeds }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # The FP pin (panobbgo/fp_env.py): the entry points set it themselves;
    # the job-level copy also covers anything that loads numpy first.
    # AVX2 and AVX-512 runners then run the same kernels.
    env:
      OPENBLAS_CORETYPE: Haswell
      NPY_DISABLE_CPU_FEATURES: X86_V4 AVX512_ICL AVX512_SPR

    steps:
      - uses: actions/checkout@v6
        with:
          # The commit the plan resolved: every shard measures the same code.
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Cache UV and dependencies
        id: cache-uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uv
            .venv
          key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Cache IOH worker venv
        id: cache-ioh-worker
        if: startsWith(matrix.suite, 'ioh-')
        uses: actions/cache@v5
        with:
          path: tools/ioh_worker/.venv
          key: ioh-worker-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('tools/ioh_worker/pyproject.toml', 'tools/ioh_worker/uv.lock') }}
          restore-keys: |
            ioh-worker-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Install UV
        run: |
          if [ ! -f "$HOME/.cargo/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Always: the shared cache key does not say which extras the cached
      # .venv has (tests.yml adds baselines, docs.yml does not), and a suite
      # may need more (the matrix's '+'-joined extras, e.g. ioh-external:
      # baselines).  On a warm .venv this takes seconds.
      - name: Install dependencies
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          args=(--extra dev)
          IFS=+ read -ra extras <<< "$EXTRAS"
          for e in "${extras[@]}"; do if [ -n "$e" ]; then args+=(--extra "$e"); fi; done
          uv sync "${args[@]}"

      - name: Sync IOH worker venv
        if: startsWith(matrix.suite, 'ioh-') && steps.cache-ioh-worker.outputs.cache-hit != 'true'
        run: |
          cd tools/ioh_worker
          uv sync

      - name: Runner CPU
        run: |
          lscpu | grep -E '^Model name' || true
          echo "ISA: $(grep -o -w -E 'avx2|fma|avx512f' /proc/cpuinfo | sort -u | tr '\n' ' ')"

      - name: Measure
        env:
          SUITE: ${{ matrix.suite }}
          SEEDS: ${{ matrix.seeds }}
          SHARD: ${{ matrix.shard }}
        run: |
          uv run python scripts/rebaseline.py run "$SUITE" --seeds "$SEEDS" --shard "$SHARD" \
            --out-dir rebaseline-out --jobs "$(nproc)"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.suite }}-${{ matrix.shard }}
          path: rebaseline-out/
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [plan, measure]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    # Only this job writes: it creates the release that holds the reference files.
    permissions:
      contents: write
    # Two runs never resolve and create release tags at the same time.  GitHub
    # keeps one pending job per group: a third run's aggregate cancels the
    # pending one (its shard artifacts survive; aggregate + publish locally).
    concurrency:
      group: rebaseline-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Cache UV and dependencies
        id: cache-uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uv
            .venv
          key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Install UV
        run: |
          if [ ! -f "$HOME/.cargo/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: |
          uv sync --extra dev

      - name: Download shard results
        uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: rebaseline-raw

      - name: Aggregate
        env:
          # The planned matrix: a shard that left no meta file counts as failed.
          PLAN: ${{ needs.plan.outputs.matrix }}
        run: |
          set -o pipefail
          printf '%s' "$PLAN" > plan.json
          uv run python scripts/rebaseline.py aggregate rebaseline-raw --out-dir references --plan plan.json 2>&1 \
            | tee aggregate.log
          { echo '### Re-baseline references'; echo '```'; cat aggregate.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The raw ref_* files are not committed to git (doc/dev/benchmarking.md):
      # they become assets of a pre-release tagged rebaseline-<date> on the
      # measured commit; SUMMARY.json records the tag and URL and is the file
      # to commit (together with ref_MANIFEST.json).
      - name: Publish the release
        if: ${{ inputs.release != 'none' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          SHA: ${{ needs.plan.outputs.sha }}
          # 'auto' publishes only a complete run (publish refuses otherwise).
          MEASURE: ${{ needs.measure.result }}
        run: |
          set -o pipefail
          tag_args=()
          if [ "$RELEASE" != "auto" ]; then tag_args=(--tag "$RELEASE"); fi
          uv run python scripts/rebaseline.py publish references "${tag_args[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --measure-result "$MEASURE" 2>&1 | tee publish.log
          uv run python scripts/rebaseline.py summarize references --print > summary.md
          { echo '### Release'; tail -n 1 publish.log; echo; cat summary.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload references
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rebaseline-references
          path: references/
          retention-days: 90
