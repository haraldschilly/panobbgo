name: Nightly Self-Improvement Loop

# Runs the autonomous self-improvement loop (planning/SELF_IMPROVEMENT_LOOP.md
# §9 / §12) once per day.  Appends to the metric-specific ledger
# (planning/self_improve_ledger_aocc.jsonl by default since 2026-07-09;
# planning/self_improve_ledger.jsonl for a composite A/B dispatch) and
# regenerates planning/self_improve_summary.txt, then commits both back to
# master with [skip ci] so the daily Claude routine has fresh trend data.

on:
  schedule:
    # 03:00 UTC daily — off hours, no collision with PR CI.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of loop iterations"
        required: false
        default: "20"
      mode:
        description: "Harness mode (quick / standard / full)"
        required: false
        default: "quick"
      confirm_accepts:
        description: "Enable §6.4 same-night confirmation gate (--confirm-accepts)"
        required: false
        type: boolean
        default: true
      metric:
        description: >-
          Metric that drives accept/reject (§9.5 step 2).  'aocc' is the
          default since 2026-07-09: the IOH/MA-BBOB anytime metric — the
          V2 answer to §2.1 "no metric resolution".  Every evaluation
          moves AOCC continuously, eliminating the composite Δ=0 dead
          zone (measured quick-mode A/B: composite median seed score
          0.036 with an 8% Δ=0 rate vs aocc 0.33 with 0% Δ=0; see the
          2026-07-09 entry in planning/SELF_IMPROVEMENT_LOG.md).  Select
          'composite' to run the historical internal-battery metric for
          an A/B comparison against the frozen composite ladder.  Each
          metric writes its own ledger so the two never mix.
        required: false
        type: choice
        options:
          - aocc
          - composite
        default: aocc

# Only one nightly run at a time.  Manual workflow_dispatch invocations
# wait for the scheduled run to finish (or vice versa).
concurrency:
  group: self-improve-nightly
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON: "3.12"

jobs:
  self-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          # Shallow clone is enough to push fast-forward commits to
          # master.  fetch-depth: 0 listed every remote branch in the
          # log (~100 lines of noise on this repo).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ env.PYTHON }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Cache UV and dependencies
        id: cache-uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uv
            .venv
          key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ env.PYTHON }}-

      # The IOH worker venv is only needed when the operator flips the
      # workflow_dispatch `metric` input to `aocc`.  We still cache /
      # sync it eagerly here (mirrors tests.yml) so a scheduled run
      # started with --metric aocc via workflow_dispatch does not need
      # a fresh manylinux wheel download on every fire — the cp312
      # wheel is ~8 MiB, so this adds ~2s to a cold cache and is a
      # no-op on a warm cache.
      - name: Cache IOH worker venv
        id: cache-ioh-worker
        uses: actions/cache@v5
        with:
          path: tools/ioh_worker/.venv
          key: ioh-worker-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('tools/ioh_worker/pyproject.toml', 'tools/ioh_worker/uv.lock') }}
          restore-keys: |
            ioh-worker-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Install UV
        run: |
          if [ ! -f "$HOME/.cargo/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: uv sync --extra dev

      - name: Sync IOH worker venv
        # Enables --metric aocc (§9.5 step 2).  Cheap: the cp312
        # manylinux wheel downloads in seconds; no C++ compile.  Kept
        # eager (not gated on the workflow_dispatch metric input) so
        # the ioh_worker .venv is warm the moment an operator flips
        # metric=aocc — otherwise the first aocc run pays the ~2 s
        # cold-cache tax under the 90-min cap.
        if: steps.cache-ioh-worker.outputs.cache-hit != 'true'
        run: |
          cd tools/ioh_worker
          uv sync

      - name: Resolve ledger path
        # Each metric writes its own append-only ledger so composite
        # deltas (~0.003 scale) and aocc deltas (~0.3 scale) never mix in
        # codify-scan's pooled CI or the graded bandit reward.  aocc — the
        # default since 2026-07-09 — keeps the canonical basename plus an
        # ``_aocc`` suffix; composite keeps the historical
        # ``self_improve_ledger.jsonl`` so its 660-record durability
        # history stays intact and untouched by the flip.  The value is
        # exported to $GITHUB_ENV so the run / summary / commit / artifact
        # steps below all reference the same file.
        env:
          METRIC: ${{ github.event.inputs.metric || 'aocc' }}
        run: |
          set -euo pipefail
          if [ "$METRIC" = "aocc" ]; then
            echo "LEDGER=planning/self_improve_ledger_aocc.jsonl" >> "$GITHUB_ENV"
          else
            echo "LEDGER=planning/self_improve_ledger.jsonl" >> "$GITHUB_ENV"
          fi

      - name: Run self-improvement loop
        id: loop
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '20' }}
          MODE: ${{ github.event.inputs.mode || 'quick' }}
          # workflow_dispatch input defaults to 'true'; scheduled runs
          # have no input → fall through to 'true' too so the §6.4
          # confirmation gate is the default everywhere.  Override with
          # workflow_dispatch confirm_accepts=false for the A/B regime.
          CONFIRM_ACCEPTS: ${{ github.event.inputs.confirm_accepts || 'true' }}
          # V2 §9.5 step 2.  workflow_dispatch input defaults to 'aocc';
          # scheduled runs have no input → fall through to 'aocc' too so
          # the anytime metric is the default everywhere (flipped from
          # 'composite' on 2026-07-09 once the in-mode quick A/B showed
          # aocc meets §11.1 resolution and composite does not — see the
          # 2026-07-09 entry in planning/SELF_IMPROVEMENT_LOG.md).  Select
          # 'composite' via workflow_dispatch for an A/B comparison
          # against the frozen composite ladder.  With metric=aocc the
          # --mode input selects the IOH battery preset (quick / standard
          # / full) rather than the composite battery.  The two metrics
          # write separate ledgers (resolved below) so their scales never
          # mix in codify-scan pooling or the bandit reward.
          METRIC: ${{ github.event.inputs.metric || 'aocc' }}
        # V2 nightly invocation (planning/SELF_IMPROVEMENT_LOOP.md §9.4 /
        # §9.5 step 5).  Flags previously held back from the V1 cron and
        # promoted here:
        #   --registry loop                 §9.5 step 1 — exercises the
        #                                   dormant catalog (4/44 → 44/44
        #                                   kwarg-rule activation on the
        #                                   seed specs).
        #   --prime-include-archives        §2.6 — bandit posterior
        #                                   compounds across archived
        #                                   ledger rotations rather than
        #                                   forgetting each night.
        #   --structural-per-class-arms     §7.2 — per-(op, candidate
        #                                   class) bandit arms instead of
        #                                   collapsed op-level arms.
        #   --bandit-reward graded          §7.4 — graded reward in [0, 1]
        #                                   so honest near-miss rejects
        #                                   carry r ≈ 0.5 of evidence.
        #   --inactivity-relax-after 10     2026-05-30 — break long accept
        #   --inactivity-relax-factor 0.5   droughts by geometrically
        #                                   relaxing eps_accept, floored
        #                                   at --inactivity-min-eps-accept
        #                                   (default 0.001, the bootstrap
        #                                   CI noise floor).
        #   --holdout-base-seeds 7,1234     2026-05-16 — multi-seed
        #                                   hold-out, worst-case drift /
        #                                   any-overfit reduction.
        #   --guard-interval 10             §6.3 — guard cadence relaxed
        #                                   from 5 → 10 now that the same-
        #                                   night confirm gate is the
        #                                   primary noise-spike defence.
        #   --confirm-accepts               §6.4 — every screening accept
        #                                   re-measured on a fresh seed
        #                                   (and first hold-out seed when
        #                                   configured) before promotion;
        #                                   closes §2.2 "Accept → rollback
        #                                   churn".  Toggleable via the
        #                                   workflow_dispatch confirm_accepts
        #                                   input for A/B; default true.
        #   --metric aocc                   §9.5 step 2 — the DEFAULT since
        #                                   2026-07-09.  Runs the IOH/MA-BBOB
        #                                   anytime metric via the ioh_worker
        #                                   venv synced above; every
        #                                   evaluation moves AOCC so the
        #                                   composite Δ=0 dead zone (§2.1) is
        #                                   gone and the seed score lands in
        #                                   §11.1's responsive band.  Only
        #                                   appended when METRIC=aocc; select
        #                                   composite via workflow_dispatch
        #                                   for an A/B against the frozen
        #                                   composite ladder.
        #   --base-seed $BASE_SEED          2026-08-11 — rotated per night
        #                                   (see below).  Before this the
        #                                   flag was never passed, so all
        #                                   952 records of the 2026-07..08
        #                                   aocc ledger sat on base_seed 42
        #                                   and codify-scan's "k>=2 distinct
        #                                   nights" gate was counting k
        #                                   re-measurements of ONE instance
        #                                   draw as k independent
        #                                   confirmations.  Codify hit rate
        #                                   under that regime: 0/5.
        #   --sync-eval                     2026-08-11 — synchronous-harvest
        #                                   evaluation, shipped 2026-08-09 as
        #                                   an ioh_benchmark flag but never
        #                                   reachable from the loop.  Cuts
        #                                   single-measurement AOCC noise sd
        #                                   0.0101 -> 0.0063.
        #   --eps-accept 0.0125             2026-08-11 — 2 sigma of the
        #   --inactivity-min-eps-accept     post-sync-eval noise floor.  The
        #     0.006                         old 0.005 default sat at 0.5
        #                                   sigma of the pre-sync-eval floor,
        #                                   so ~30% of zero-effect proposals
        #                                   cleared screening and the
        #                                   observed 10.6% accept rate was
        #                                   indistinguishable from noise
        #                                   (0.30 screen x 0.34 confirm).
        #                                   The relax floor moves with it —
        #                                   at the old 0.001 the inactivity
        #                                   rule walked the bar straight back
        #                                   under the noise.
        run: |
          set -euo pipefail
          # Rotate the instance-family draw per night.  Deterministic
          # (derived from the UTC date, not $RANDOM) so a night is
          # reproducible from its ledger record, and prime-length so the
          # rotation does not alias with a weekly cadence.  Seed 42 stays
          # in the pool as the historical continuity point; 7 and 1234
          # are excluded because they are the hold-out seeds and the
          # confirm gate must stay independent of the screening draw.
          SEEDS=(42 101 202 303 404 505 606)
          DAY=$(date -u +%j)
          BASE_SEED=${SEEDS[$((10#$DAY % ${#SEEDS[@]}))]}
          echo "[nightly] base_seed=$BASE_SEED (day-of-year $DAY)"
          CMD=(
            uv run python scripts/self_improve.py run
            --iterations "$ITERATIONS"
            --mode "$MODE"
            --base-seed "$BASE_SEED"
            --registry loop
            --adaptive
            --adaptive-prime-from-ledger
            --prime-include-archives
            --structural
            --structural-per-class-arms
            --bandit-reward graded
            --inactivity-relax-after 10
            --inactivity-relax-factor 0.5
            --holdout-base-seeds 7,1234
            --guard-interval 10
            --ledger "$LEDGER"
          )
          if [ "$CONFIRM_ACCEPTS" = "true" ]; then
            CMD+=(--confirm-accepts)
          fi
          if [ "$METRIC" = "aocc" ]; then
            # The recalibrated thresholds are AOCC-scale (battery mean
            # ~0.34).  The composite battery's mean score is ~0.045, so
            # the same absolute epsilon there would be a ~28% relative
            # bar instead of ~3.7% — leave the composite path on its
            # historical 0.005 / 0.001 defaults.
            CMD+=(
              --metric aocc
              --sync-eval
              --eps-accept 0.0125
              --inactivity-min-eps-accept 0.006
            )
          fi
          "${CMD[@]}"

      - name: Regenerate summary
        if: always()
        run: |
          if [ -f "$LEDGER" ]; then
            uv run python scripts/self_improve.py summary \
              "$LEDGER" \
              > planning/self_improve_summary.txt
          else
            echo "No ledger file present ($LEDGER) — skipping summary."
          fi

      - name: Regenerate codify-scan report
        # Committed alongside the summary so the repo always carries the
        # current actionable codify evidence — an agent (or the operator)
        # picking up the daily routine can read
        # planning/self_improve_codify_scan.txt without running anything.
        # Metric-aware (2026-07-30): the scan's suppression check and the
        # report's candidates key on the registry the selected metric
        # actually measures (aocc → make_ioh_strategies).
        if: always()
        env:
          METRIC: ${{ github.event.inputs.metric || 'aocc' }}
        run: |
          if [ -f "$LEDGER" ]; then
            uv run python scripts/self_improve.py codify-scan \
              --metric "$METRIC" \
              --ledger "$LEDGER" \
              > planning/self_improve_codify_scan.txt
          else
            echo "No ledger file present ($LEDGER) — skipping codify-scan report."
          fi

      - name: Commit ledger + summary
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain "$LEDGER" planning/self_improve_summary.txt planning/self_improve_codify_scan.txt)" ]; then
            echo "No ledger changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER" planning/self_improve_summary.txt
          if [ -f planning/self_improve_codify_scan.txt ]; then
            git add planning/self_improve_codify_scan.txt
          fi
          ITER="${{ github.event.inputs.iterations || '20' }}"
          MODE="${{ github.event.inputs.mode || 'quick' }}"
          METRIC="${{ github.event.inputs.metric || 'aocc' }}"
          # Always surface the metric now that aocc is the default and each
          # metric writes its own ledger — the tag disambiguates which
          # ledger the commit touched.
          git commit -m "chore(self_improve): nightly loop run ($ITER iter, mode=$MODE, metric=$METRIC) [skip ci]"
          # Retry once on push race: someone landed a commit while we were running.
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); fetching and rebasing."
            git fetch origin master
            git rebase origin/master
          done
          echo "Push still failing after 3 attempts; aborting."
          exit 1

      - name: Upload ledger as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-improve-ledger-${{ github.run_id }}
          path: |
            ${{ env.LEDGER }}
            planning/self_improve_summary.txt
            planning/self_improve_codify_scan.txt
          retention-days: 30
