name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Cache UV and dependencies
        id: cache-uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uv
            .venv
          key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Cache IOH worker venv
        id: cache-ioh-worker
        uses: actions/cache@v5
        with:
          path: tools/ioh_worker/.venv
          key: ioh-worker-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('tools/ioh_worker/pyproject.toml', 'tools/ioh_worker/uv.lock') }}
          restore-keys: |
            ioh-worker-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Install UV
        run: |
          if [ ! -f "$HOME/.cargo/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        # Runs even on a cache hit: the venv cache key is shared with the
        # other jobs, which install `--extra dev` only, so a hit may lack the
        # `baselines` extra (pycma, Nevergrad, Optuna) whose adapter tests
        # would then skip.  If the cached venv already has the extra, the
        # sync only verifies it; otherwise it installs the extra's packages
        # from uv's download cache or PyPI.
        run: |
          uv sync --extra dev --extra baselines

      - name: Sync IOH worker venv
        # Enables the IOH integration tests (`requires_worker` marker).
        # The cp312 manylinux wheel downloads in seconds; no C++ compile.
        if: steps.cache-ioh-worker.outputs.cache-hit != 'true'
        run: |
          cd tools/ioh_worker
          uv sync

      - name: Run pytest
        # `--durations=25` (from pyproject `addopts`) prints the slowest 25
        # tests so every CI run records where the ~20 min wall-clock goes —
        # the suite is dominated by latency-bound `.start()` integration
        # tests (threaded event loop, not CPU).
        #
        # NOTE: the suite is NOT yet run in parallel here. `pytest-xdist` is
        # installed and `-n auto --dist loadscope` works locally with a large
        # wall-clock win, but two issues must be fixed first (see
        # planning/TEST_PERFORMANCE.md): (1) one worker hangs in teardown at
        # end-of-run (a non-daemon background thread left by a strategy/dask
        # test), which would trip the 25 min job timeout; (2) a couple of
        # timing-sensitive tests can fail under heavy CPU contention;
        # `pytest-retry` is in the `--extra dev` set, so their
        # `@pytest.mark.flaky(retries=3)` markers retry, but -n adds load.
        run: |
          uv run pytest -v --cov=panobbgo --cov-report=xml --cov-report=term
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  test-bo:
    # The expensive-track baselines (`baselines-bo` extra: CPU torch,
    # BoTorch, SMAC3, Py-BOBYQA) in a job of their own, so the default test
    # job stays free of torch (~0.7 GB installed); there their tests skip.
    # No .venv cache (a torch venv is ~360 MB per entry and would evict the
    # other jobs' caches): setup-uv caches uv's download cache under its own
    # suffix and prunes it for CI (`uv cache prune --ci`).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Install UV (with its download cache)
        uses: astral-sh/setup-uv@v10.2.0  # no floating major tag after v7
        with:
          enable-cache: true
          cache-suffix: bo
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra baselines-bo

      - name: Run the expensive-track baseline tests
        run: |
          uv run pytest -v tests/test_harness_baselines_bo.py

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Cache UV and dependencies
        id: cache-uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uv
            .venv
          key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Install UV
        run: |
          if [ ! -f "$HOME/.cargo/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: |
          uv sync --extra dev

      - name: Run flake8
        run: |
          uv run flake8 panobbgo --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 panobbgo --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Cache UV and dependencies
        id: cache-uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uv
            .venv
          key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Install UV
        run: |
          if [ ! -f "$HOME/.cargo/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: |
          uv sync --extra dev

      - name: Run Pyright
        run: |
          uv run pyright panobbgo

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Cache UV and dependencies
        id: cache-uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uv
            .venv
          key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Install UV
        run: |
          if [ ! -f "$HOME/.cargo/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: |
          uv sync --extra dev

      - name: Install Sphinx
        run: |
          uv add --dev sphinx

      - name: Run documentation doctests
        run: |
          uv run sphinx-build -b doctest doc/source doc/build/doctest
          echo "✅ Documentation doctests passed!"

  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Cache UV and dependencies
        id: cache-uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uv
            .venv
          key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Install UV
        run: |
          if [ ! -f "$HOME/.cargo/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: |
          uv sync --extra dev

      - name: Run benchmark suite
        run: |
          # Run benchmarks with timeout - should complete in under 1 minute
          timeout 60 uv run pytest benchmarks/ --benchmark-min-rounds=1 --benchmark-max-time=0.1 -q
          echo "✅ Benchmark suite completed successfully in under 1 minute"

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Cache UV and dependencies
        id: cache-uv
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/uv
            .venv
          key: uv-${{ runner.os }}-python-${{ env.PYTHON }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ env.PYTHON }}-

      - name: Install UV
        run: |
          if [ ! -f "$HOME/.cargo/bin/uv" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        if: steps.cache-uv.outputs.cache-hit != 'true'
        run: |
          uv sync --extra dev

      - name: Check formatting with ruff
        # `--extra dev` ensures ruff is in the synced env even when the
        # cache key matches but uv decided to re-sync the venv without
        # the dev extras (observed on rebuilds of the same commit
        # hash — `uv run ruff` then auto-installs only main deps and
        # errors with "Failed to spawn: ruff").
        run: |
          uv run --extra dev ruff format --check .
