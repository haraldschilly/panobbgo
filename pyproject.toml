[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panobbgo"
version = "0.0.1"
description = "Parallel Noisy Black-Box Global Optimization"
readme = "README.md"
authors = [
  { name = "Harald Schilly", email = "harald.schilly@gmail.com" },
]
license = { text = "Apache 2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
keywords = ["optimization", "blackbox", "stochastic", "noisy", "parallel", "distributed", "cluster"]
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9",
    "statsmodels>=0.15",
    "pyyaml>=6.0.3",
    "future>=1.0",
    "rich>=15.0",
    "cocopp>=2.8.8",
    "pytest-benchmark>=5.3",
]
requires-python = ">=3.14"

[project.urls]
"Homepage" = "http://github.com/haraldschilly/panobbgo"

[project.optional-dependencies]
# Distributed evaluation backend (evaluation_method = "dask") — optional
# since the framework only imports it lazily via panobbgo/dask_evaluation.py.
dask = [
    "dask[distributed]>=2026.8.0",
]
benchmark = [
    "coco-experiment>=2.8.2",
    # IOH (ioh>=0.3.22) lives in the isolated `tools/ioh_worker/` uv
    # project — its cp-only wheel coverage (no cp313 yet) would otherwise
    # pin panobbgo to ≤ Python 3.12.  Run `cd tools/ioh_worker && uv sync`
    # to enable the IOH harness.
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.8",
    "pytest-benchmark>=5.3",
    # pytest-retry powers @pytest.mark.flaky — without it here, the markers
    # are a silent no-op in CI (which installs via `uv sync --extra dev`).
    "pytest-retry>=1.7.0",
    # dask is an optional runtime extra; the dask backend tests need it.
    "dask[distributed]>=2026.8.0",
    # distributed pulls tornado; floor it explicitly so a lockfile refresh
    # cannot drop back below the 6.5.8 security release.
    "tornado>=6.5.8",
    "flake8>=7.3",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "pyright>=1.1.411",
    "types-setuptools>=84.0",
    "pandas-stubs>=3.0",
    "sphinx>=9.1",
    "shibuya>=2026.7.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["panobbgo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--durations` surfaces the slowest tests on every run so we keep timing
# data to spot long-running integration drivers (e.g. the CMA-ES IPOP/BIPOP
# `.start()` tests, which are wall-clock/event-loop bound, not CPU bound).
# Parallelism is opt-in via the CLI: `pytest-xdist` is installed, so
# `uv run pytest -n auto --dist loadscope` parallelises the suite locally
# for a large wall-clock win. It is not yet wired into CI — see
# planning/TEST_PERFORMANCE.md for the two blockers (end-of-run teardown
# hang + flaky tests under contention). A plain `pytest` stays serial.
addopts = "--durations=25 -ra"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's *default* selection through 0.14 was E4/E7/E9 + F.  0.16 widened
# the defaults (pyupgrade, isort, flake8-blind-except, bandit, ...), which
# turns a version bump into ~2000 findings across untouched files.  Pin the
# historical selection so upgrading ruff stays a dependency change; opting
# into the new rules is a separate, deliberate decision.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["panobbgo"]
exclude = ["**/__pycache__", ".venv", "build", "dist"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"  # Can be "off", "basic", or "strict"
reportMissingImports = "warning"  # Warn instead of error for missing imports
reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportGeneralTypeIssues = "warning"  # Warn instead of error for general type issues
reportAttributeAccessIssue = "warning"  # Warn instead of error for attribute access
reportCallIssue = "warning"  # Warn for missing arguments
reportArgumentType = "warning"  # Warn for argument type mismatches
reportPrivateImportUsage = "warning"

[dependency-groups]
dev = [
    "dask[distributed]>=2026.1.1",
    "flake8>=7.3.0",
    "pyright>=1.1.407",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.6",
    "pytest-retry>=1.7.0",
    "pytest-benchmark>=4.0",
    "shibuya>=2026.1.9",
    "sphinx>=8.1.3",
]
