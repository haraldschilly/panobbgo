[project]
name = "panobbgo-ioh-worker"
version = "0.1.0"
description = "Isolated subprocess hosting the ioh C++ problem builders for panobbgo's IOH harness."
requires-python = ">=3.11,<3.13"
dependencies = [
    "ioh>=0.3.22",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ioh_worker"]
